<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="examples-styles.css" />

    <title>abcjs: Basic Demo</title>
    <script src="../dist/abcjs-basic.js" type="text/javascript"></script>
    <script type="text/javascript">
      var abc = `X:844
T:Whiskey for Breakfast
T:Whiskey before Breakfast
R:reel
O:American
Z:id:hn-reel-844
M:C|
L:1/8
K:D
D2F2 A4 | ABAF EDEF | G2BG F2AF | EDEF E6|
D2F2 A4 | ABAF EDEF | G2BG F2AF | EDEF D4 :|
|: DFAc d2Ac | dBAF E2D2 | e4 e2ef | gfed cABc |
d2fd c2ec | BABc BAFD | G2BG F2AF | EDEF D4 :| \n\n`;

      function load() {
        ABCJS.renderAbc("paper", abc, {
          tablature: [
            { instrument: "banjo", tuning: ["C", "G", "c", "d", "g"], capo: 2 },
          ],
        });
      }
    </script>
  </head>

  <body onload="load()">
    <header>
      <img
        src="https://paulrosen.github.io/abcjs/img/abcjs_comp_extended_08.svg"
        alt="abcjs logo"
      />
      <h1>Basic abcjs</h1>
    </header>
    <div class="container">
      <p>On page load, a hard-coded tune is displayed on the page.</p>
      <div id="paper"></div>
    </div>
  </body>
</html>
