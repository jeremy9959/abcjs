<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="favicon.ico" type="image/x-icon" />
	<link rel="stylesheet" href="examples-styles.css" />

	<title>abcjs: Basic Demo</title>
	<script src="../dist/abcjs-basic.js" type="text/javascript"></script>
	<script type="text/javascript">
		var abc = "X:1\n" +
			"T:Speed the Plough\n" +
			"M:4/4\n"+
			"C:Trad.\n" +
			"K:G\n" +
			"|:GABc dedB|dedB dedB|c2ac B2dB|c2A2 A2BA|\n" +
			"  GABc dedB|dedB dedB|c2ec B2dB|A2F2 G4:|\n"+
			"|:g2gf gdBd|g2f2 e2d2|c2ec B2dB|c2A2 A2df|\n"+
			"  g2gf g2Bd|g2f2 e2d2|c2ec B2dB|A2F2 G4:|\n\n"



		function load() {
			ABCJS.renderAbc("paper", abc, { tablature: [{ instrument: "banjo", tuning: ["D", "A", 'd', 'e', 'a'], fretOffset: [0,0,0,0,5]}] });
		}

	</script>
</head>

<body onload="load()">
	<header>
		<img src="https://paulrosen.github.io/abcjs/img/abcjs_comp_extended_08.svg" alt="abcjs logo">
		<h1>Basic abcjs</h1>
	</header>
	<div class="container">
		<p>On page load, a hard-coded tune is displayed on the page.</p>
		<div id="paper"></div>
	</div>
</body>

</html>
